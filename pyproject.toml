[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td-open"
version = "0.3.0"
description = "Local-first open-source visual programming with AI and MCP integrations"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["operator_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest-tmp"
cache_dir = ".cache/pytest"
