name: Build desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/*desktop*'
      - 'tests/test_desktop.py'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
            target: win
          - runner: macos-15
            os: macos
            arch: arm64
            target: mac
          - runner: macos-15-intel
            os: macos
            arch: x64
            target: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r requirements.lock -r desktop/requirements-build.txt -r desktop/requirements-runtime.txt
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix desktop ci
          npm --prefix desktop test
      - name: Native backend regression checks
        run: python -m pytest tests/test_desktop.py tests/test_io_runtime.py tests/test_script_runtime.py
      - name: Bundle native Python, Node, browser and media runtime
        run: python scripts/build-desktop-runtime.py
      - name: Build installer
        run: npm --prefix desktop run package -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Launch and verify packaged desktop
        run: python scripts/smoke-desktop.py
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: TD-Open-${{ matrix.os }}-${{ matrix.arch }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            build/desktop/verification/native-smoke.json
            build/desktop/verification/native-smoke.png
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-logs-${{ matrix.os }}-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            build/desktop/verification/
            .cache/desktop-smoke/**/logs/
            dist/desktop/builder-debug.yml
