name: Validate studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock -e '.[dev]'
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check committed operator manifest
        run: node scripts/sync-catalog.mjs --check
      - name: Unit and integration tests
        run: |
          python -m pytest
          npm --prefix frontend test
      - name: Production build and reproducible examples
        run: |
          npm --prefix frontend run build
          node scripts/export-examples.mjs
          python scripts/export-node-docs.py
          git diff --exit-code -- backend/operator_catalog.json examples docs/EXAMPLES.md docs/NODES.md
